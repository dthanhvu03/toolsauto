<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login • Auto Publisher</title>
    <script src="{{ config.CDN_TAILWIND }}"></script>
    <link href="{{ config.CDN_GOOGLE_FONTS }}" rel="stylesheet">
    <link rel="stylesheet" href="/static/cave-tokens.css" />
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Figtree', 'sans-serif'],
                        display: ['Syne', 'sans-serif'],
                    },
                    animation: {
                        'blob': 'blob 7s infinite',
                        'fade-in': 'fadeIn 0.5s ease-out forwards',
                        'slide-up': 'slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                    },
                    keyframes: {
                        blob: {
                            '0%': { transform: 'translate(0px, 0px) scale(1)' },
                            '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                            '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                            '100%': { transform: 'translate(0px, 0px) scale(1)' },
                        },
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        slideUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: var(--font-sans);
            background: var(--color-void);
            margin: 0;
            overflow: hidden;
            color: var(--color-ink);
        }
        h1, h2, h3, h4, .font-display { font-family: var(--font-display); }

        .glass-panel {
            background: color-mix(in srgb, var(--color-stone) 88%, transparent);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--color-border);
            box-shadow: var(--shadow-panel);
        }

        input:-webkit-autofill,
        input:-webkit-autofill:hover,
        input:-webkit-autofill:focus,
        input:-webkit-autofill:active {
            -webkit-box-shadow: 0 0 0 30px var(--color-deep) inset !important;
            -webkit-text-fill-color: var(--color-ink) !important;
            transition: background-color 5000s ease-in-out 0s;
        }

        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @keyframes slideOutRight {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(100%); opacity: 0; }
        }
        .toast-enter { animation: slideInRight 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .toast-exit { animation: slideOutRight 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    </style>
</head>
<body class="theme-cave min-h-screen text-[var(--color-ink)] flex items-center justify-center relative">
    
    <!-- Background Ambient Effects -->
    <div class="absolute inset-0 overflow-hidden pointer-events-none">
        <div class="absolute top-[-10%] left-[-10%] w-96 h-96 rounded-full mix-blend-screen filter blur-[100px] opacity-25 animate-blob" style="background: var(--color-torch);"></div>
        <div class="absolute top-[20%] right-[-10%] w-96 h-96 rounded-full mix-blend-screen filter blur-[100px] opacity-15 animate-blob" style="animation-delay: 2s; background: var(--color-ember);"></div>
        <div class="absolute bottom-[-20%] left-[20%] w-[500px] h-[500px] rounded-full mix-blend-screen filter blur-[120px] opacity-10 animate-blob" style="animation-delay: 4s; background: var(--color-moss);"></div>
    </div>

    <!-- Login Container -->
    <div class="relative w-full max-w-[420px] p-6 z-10 animate-slide-up">
        
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl mb-4" style="background: var(--gradient-torch); box-shadow: var(--glow-torch);">
                <svg class="w-6 h-6 text-[var(--color-ink-inverse)]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
                </svg>
            </div>
            <h1 class="text-3xl font-display font-bold text-[var(--color-ink)] tracking-tight mb-2">Auto Publisher</h1>
            <p class="text-[var(--color-mist)] text-sm">Hệ thống tự động đăng bài</p>
        </div>

        <div class="glass-panel rounded-2xl p-8 relative overflow-hidden">
            <div class="absolute top-0 inset-x-0 h-[1px] opacity-60" style="background: linear-gradient(90deg, transparent, var(--color-torch), transparent);"></div>
            
            <form id="loginForm" class="space-y-5" onsubmit="handleLogin(event)">
                <div class="space-y-1">
                    <label class="text-sm font-medium text-[var(--color-ink-soft)] ml-1">Tên đăng nhập</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <svg class="h-5 w-5 text-[var(--color-ash)]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                            </svg>
                        </div>
                        <input type="text" name="username" required
                            class="block w-full pl-10 pr-3 py-2.5 border border-[var(--color-border)] rounded-xl bg-[var(--color-deep)] text-[var(--color-ink)] placeholder-[var(--color-ash)] focus:outline-none focus:ring-2 focus:ring-[var(--color-focus-ring)] focus:border-[var(--color-torch)] transition-all font-medium sm:text-sm"
                            placeholder="Nhập tên đăng nhập">
                    </div>
                </div>

                <div class="space-y-1">
                    <label class="text-sm font-medium text-[var(--color-ink-soft)] ml-1">Mật khẩu</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <svg class="h-5 w-5 text-[var(--color-ash)]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                            </svg>
                        </div>
                        <input type="password" name="password" id="passwordInput" required
                            class="block w-full pl-10 pr-10 py-2.5 border border-[var(--color-border)] rounded-xl bg-[var(--color-deep)] text-[var(--color-ink)] placeholder-[var(--color-ash)] focus:outline-none focus:ring-2 focus:ring-[var(--color-focus-ring)] focus:border-[var(--color-torch)] transition-all font-medium sm:text-sm"
                            placeholder="••••••••">
                        <button type="button" onclick="togglePassword()" class="absolute inset-y-0 right-0 pr-3 flex items-center text-[var(--color-ash)] hover:text-[var(--color-mist)] transition-colors">
                            <svg id="eyeIcon" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                            </svg>
                        </button>
                    </div>
                </div>

                <div id="errorContainer" class="hidden rounded-lg bg-[var(--color-danger-dim)] border border-[var(--color-danger-border)] p-3">
                    <p id="errorText" class="text-sm text-[var(--color-danger)] font-medium text-center"></p>
                </div>

                <div class="pt-2">
                    <button type="submit" id="submitBtn"
                        class="w-full flex justify-center py-2.5 px-4 border border-transparent rounded-xl text-sm font-bold text-[var(--color-ink-inverse)] transition-all active:scale-[0.98]"
                        style="background: var(--gradient-torch);">
                        <span id="submitText">Đăng nhập</span>
                        <svg id="submitSpinner" class="hidden animate-spin h-5 w-5 text-[var(--color-ink-inverse)]" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                    </button>
                </div>
            </form>
        </div>
        
        <div class="text-center mt-6 text-xs text-[var(--color-ash)]">
            &copy; 2026 Auto Publisher · Chỉ dành cho quản trị viên
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toastContainer" class="fixed top-4 right-4 z-[60] flex flex-col gap-2 w-full max-w-sm pointer-events-none"></div>

    <script>
        function togglePassword() {
            const input = document.getElementById('passwordInput');
            const icon = document.getElementById('eyeIcon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />`;
            } else {
                input.type = 'password';
                icon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />`;
            }
        }

        function stripLoginQueryParams() {
            if (window.location.search) {
                const url = window.location.pathname + window.location.hash;
                window.history.replaceState({}, document.title, url);
            }
        }
        stripLoginQueryParams();

        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            if (!container) return;
            const toast = document.createElement('div');
            toast.className = 'toast-enter pointer-events-auto glass-panel rounded-xl px-4 py-3 flex items-start gap-3';
            const accent = type === 'error' ? 'var(--color-danger)' : 'var(--color-moss)';
            toast.innerHTML = `
                <div class="mt-0.5" style="color:${accent}">
                    <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                </div>
                <div class="flex-1 min-w-0">
                    <p class="text-sm font-medium text-[var(--color-ink)]">${message}</p>
                </div>
                <button type="button" onclick="this.closest('.toast-enter').remove()" class="text-[var(--color-ash)] hover:text-[var(--color-ink)] transition-colors shrink-0">
                    <svg class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" /></svg>
                </button>
            `;

            container.appendChild(toast);

            setTimeout(() => {
                if (toast.parentNode) {
                    toast.classList.remove('toast-enter');
                    toast.classList.add('toast-exit');
                    setTimeout(() => toast.remove(), 300);
                }
            }, 4000);
        }

        async function handleLogin(e) {
            e.preventDefault();
            const form = e.target;
            const submitBtn = document.getElementById('submitBtn');
            const submitText = document.getElementById('submitText');
            const spinner = document.getElementById('submitSpinner');
            const errBox = document.getElementById('errorContainer');
            const errText = document.getElementById('errorText');

            // Reset UI
            errBox.classList.add('hidden');
            submitBtn.disabled = true;
            submitText.classList.add('hidden');
            spinner.classList.remove('hidden');

            try {
                const formData = new FormData(form);
                const response = await fetch('/login', {
                    method: 'POST',
                    body: formData,
                    credentials: 'same-origin',
                    headers: { 'Accept': 'application/json' }
                });

                const contentType = response.headers.get('content-type') || '';
                if (contentType.includes('application/json')) {
                    const data = await response.json();
                    if (response.ok && data.ok) {
                        showToast('Đăng nhập thành công, đang chuyển trang...', 'success');
                        setTimeout(() => {
                            window.location.href = data.redirect || '/';
                        }, 400);
                    } else {
                        showError(data.message || 'Thông tin đăng nhập không hợp lệ');
                    }
                } else {
                    showError('System error: Invalid server response.');
                }
            } catch (error) {
                showError('Network error. Please try again.');
            } finally {
                submitBtn.disabled = false;
                submitText.classList.remove('hidden');
                spinner.classList.add('hidden');
            }
        }

        function showError(msg) {
            const errBox = document.getElementById('errorContainer');
            const errText = document.getElementById('errorText');
            errBox.classList.remove('hidden');
            errText.textContent = msg;
            showToast(msg, 'error');
        }
    </script>
</body>
</html>
