<!-- fragments/syspanel/screenshots.html -->
{% if shots %}
<div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3">
    {% for shot in shots %}
    <div class="group relative rounded-lg overflow-hidden border border-[var(--color-border)] bg-[var(--color-surface-sunken)] hover:shadow-md transition-all cursor-pointer"
        onclick="window.open('/syspanel/screenshot?path={{ shot.path | urlencode }}', '_blank')">
        <img src="/syspanel/screenshot?path={{ shot.path | urlencode }}" alt="{{ shot.name }}"
            class="w-full h-28 object-cover group-hover:scale-105 transition-transform duration-300" loading="lazy"
            onerror="this.onerror=null; this.alt='Không tải được ảnh'; this.className='w-full h-28 object-contain bg-[var(--color-ledge)] p-2 text-[10px]'; this.src='data:image/svg+xml,'+encodeURIComponent('<svg xmlns=&quot;http://www.w3.org/2000/svg&quot; width=&quot;120&quot; height=&quot;80&quot;><rect fill=&quot;%453f36&quot; width=&quot;120&quot; height=&quot;80&quot;/><text x=&quot;60&quot; y=&quot;44&quot; fill=&quot;%239a9186&quot; text-anchor=&quot;middle&quot; font-size=&quot;10&quot;>No image</text></svg>')">
        <div class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black/60 to-transparent px-2 py-1.5">
            <div class="text-white text-[10px] font-mono truncate">{{ shot.name }}</div>
            <div class="text-gray-300 text-[9px]">{{ shot.mtime }}</div>
        </div>
    </div>
    {% endfor %}
</div>
{% else %}
<div class="text-center py-8 text-[var(--color-ash)]">
    <svg class="w-8 h-8 mx-auto text-[var(--color-ledge)] mb-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
            d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
    </svg>
    <div class="text-sm text-[var(--color-mist)]">Chưa có screenshot nào</div>
    <div class="text-[11px] mt-1.5 text-[var(--color-ash)] max-w-sm mx-auto leading-relaxed">
        Ảnh xuất hiện khi job fail / debug Gemini (thư mục <code class="text-[var(--color-mist)]">logs/fb</code>, <code class="text-[var(--color-mist)]">logs/debug_steps</code>…). Bấm Refresh sau khi chạy job.
    </div>
</div>
{% endif %}
