<div class="account-item cave-item group flex items-center gap-[var(--space-3)] p-[var(--space-3)] cursor-pointer
    {% if highlight_id is defined and highlight_id == account.id %}cave-item-active{% endif %}"
    hx-get="/accounts/{{ account.id }}/details" hx-target="#accountDetailArea" hx-swap="innerHTML"
    onclick="document.querySelectorAll('.account-item').forEach(el => el.classList.remove('cave-item-active')); this.classList.add('cave-item-active')">

    <div class="relative shrink-0">
        <div
            class="w-[var(--size-avatar-sm)] h-[var(--size-avatar-sm)] rounded-[var(--radius-md)] flex items-center justify-center text-[var(--color-ink)]
            {% if account.platform=='facebook' %}bg-[var(--color-fb)]{% elif account.platform=='instagram' %}{% else %}bg-[var(--color-ledge)]{% endif %}"
            {% if account.platform=='instagram' %}style="background: linear-gradient(to top right, var(--color-ig-from), var(--color-ig-to));"{% endif %}>
            <span class="text-cave-2xs font-bold">{{ account.platform[0]|upper }}</span>
        </div>
        <div
            class="absolute -bottom-0.5 -right-0.5 w-2.5 h-2.5 rounded-full border-2 border-[var(--color-stone)] {% if account.login_status == 'ACTIVE' %}cave-dot-moss{% else %}bg-[var(--color-danger-deep)]{% endif %}">
        </div>
    </div>

    <div class="min-w-0 flex-1">
        <div class="flex items-center justify-between gap-[var(--space-2)]">
            <h4 class="text-cave-sm font-bold text-[var(--color-ink)] truncate font-display">{{ account.name }}</h4>
            {% if account.is_active %}
            <span class="cave-dot cave-dot-moss"></span>
            {% endif %}
        </div>
        <p class="text-cave-2xs text-[var(--color-ash)] font-medium truncate flex items-center gap-1.5">
            <span class="inline-flex px-1.5 py-0.5 rounded-[var(--radius-sm)] text-[9px] font-bold uppercase tracking-wider border
                {% if account.platform=='facebook' %}border-[var(--color-fb)]/40 text-[var(--color-ink)] bg-[color-mix(in_srgb,var(--color-fb)_25%,transparent)]
                {% elif account.platform=='instagram' %}border-[var(--color-ig-from)]/40 text-[var(--color-ink)] bg-[color-mix(in_srgb,var(--color-ig-from)_20%,transparent)]
                {% else %}border-[var(--color-edge)] text-[var(--color-mist)] bg-[var(--color-ledge)]{% endif %}">{{ account.platform }}</span>
        </p>
    </div>

    <div class="opacity-0 group-hover:opacity-100 transition-opacity">
        <svg class="w-[var(--size-icon-sm)] h-[var(--size-icon-sm)] text-[var(--color-torch)]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7" />
        </svg>
    </div>
</div>
