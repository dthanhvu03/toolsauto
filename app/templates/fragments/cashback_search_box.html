<form method="get" action="/cashback/search" class="flex min-w-0 max-w-full gap-2">
  <input name="q" value="{{ q or '' }}" placeholder="🔍 Mã link, mã đơn, #ticket, khách, sản phẩm"
         aria-label="Tìm mã link, đơn hoặc khách"
         class="min-w-0 px-3 py-2 rounded border border-[var(--color-border)] bg-transparent text-sm w-72 max-w-full">
  <button class="shrink-0 px-3 py-2 rounded text-sm font-semibold border border-[var(--color-torch-border)] text-[var(--color-torch)]">Tìm</button>
</form>
