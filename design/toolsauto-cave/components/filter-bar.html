<!-- @dsCard group="Components" name="Thanh bộ lọc" subtitle="Bộ lọc viral + dán link + chip đếm trạng thái" width="1180" height="460" -->
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>ToolsAuto Cave — Thanh bộ lọc</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components.css">
<style>
  body { padding: var(--space-6); }
  .card { padding: 16px; }
  .bar { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .fields { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
  .acts { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .add { margin-top: 12px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .hint { flex-basis: 100%; font-size: var(--text-xs); color: var(--color-mist); }
  .links { margin-top: 8px; font-size: var(--text-xs); color: var(--color-mist); }
  .links a { color: var(--color-torch); text-decoration: underline; }
  .counts { margin-top: 16px; }
  .meta { padding: 12px 16px; border: 1px solid var(--color-border); border-radius: 0 0 var(--radius-lg) var(--radius-lg); background: var(--color-face); font-size: var(--text-xs); color: var(--color-mist); display: flex; justify-content: space-between; align-items: center; }
  .meta .busy { color: var(--color-torch); font-weight: 500; margin-left: 8px; }
</style>
</head>
<body class="theme-cave">

<div class="app-card card">
  <div class="bar">
    <div class="fields">
      <div class="field"><label>Tìm URL</label><input class="app-input" style="width:288px" placeholder="tiktok.com / reel / …"></div>
      <div class="field"><label>Trạng thái</label><select class="app-select"><option>Tất cả</option><option>Mới (NEW)</option><option>Đang xử lý</option><option>Đã tạo job</option><option>Sẵn sàng đăng tay (READY)</option><option>Lỗi (FAILED)</option><option>Reup</option><option>Chờ boost</option></select></div>
      <div class="field"><label>Nền tảng</label><select class="app-select"><option>Tất cả</option><option>tiktok</option><option>facebook</option><option>youtube</option><option>instagram</option></select></div>
      <div class="field"><label>Views tối thiểu</label><input class="app-input" type="number" value="0" style="width:128px"></div>
      <div class="field"><label>Mỗi trang</label><select class="app-select"><option>50</option><option selected>100</option><option>200</option></select></div>
    </div>
    <div class="acts">
      <button class="app-btn">Mới</button>
      <button class="app-btn">Lỗi</button>
      <button class="app-btn app-btn-primary">Áp dụng</button>
      <label class="chk"><input type="checkbox"> Tự làm mới</label>
      <button class="app-btn app-btn-torch">Quét ngay</button>
      <button class="app-btn app-btn-job">Xử lý 1 mới</button>
      <button class="app-btn app-btn-primary">Xử lý 3 mới</button>
    </div>
  </div>

  <div class="add">
    <input class="app-input" style="width:384px" type="url" placeholder="Dán link TikTok / YouTube Shorts / Facebook Reel / Instagram Reel">
    <label class="chk"><input type="checkbox"> Xử lý ngay</label>
    <button class="app-btn app-btn-torch">Thêm</button>
    <span class="hint">Chỉ dán video bạn được phép dùng lại.</span>
  </div>

  <p class="links">Cấu hình kênh nguồn: <a href="#">Tài khoản → Target Pages</a> · Kho kênh: <a href="#">Nguồn TikTok</a> · Job: <a href="#">Hàng đợi</a></p>

  <div class="counts">
    <button class="cnt cnt-new" title="NEW">Mới 0</button>
    <button class="cnt cnt-processing" title="PROCESSING">Đang xử lý 0</button>
    <button class="cnt cnt-drafted" title="DRAFTED">Đã tạo job 11</button>
    <button class="cnt cnt-ready" title="READY">Sẵn sàng đăng tay 9</button>
    <button class="cnt cnt-failed" title="FAILED">Lỗi 0</button>
    <button class="cnt cnt-all">Tất cả</button>
  </div>
  <div class="meta">
    <div>20 mục · Trang 1 / 1<span class="busy">Đang xử lý (yt-dlp + reup)…</span></div>
    <div style="display:flex;gap:8px"><button class="app-btn" disabled>← Trước</button><button class="app-btn" disabled>Sau →</button></div>
  </div>
</div>

</body>
</html>
